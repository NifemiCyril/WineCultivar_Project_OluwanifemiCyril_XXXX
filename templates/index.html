<!DOCTYPE html>
<html>
<head>
    <title>Wine Cultivar Predictor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }
        .container {
            background: white;
            padding: 25px;
            width: 350px;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, button {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
        }
        button {
            background: #5c2d91;
            color: white;
            border: none;
            cursor: pointer;
        }
        h2, h3 {
            text-align: center;
        }
    </style>
</head>

<body>
<div class="container">
    <h2>Wine Cultivar Origin Prediction</h2>

    <form method="POST">
        <input type="number" step="any" name="alcohol" placeholder="Alcohol" required>
        <input type="number" step="any" name="malic_acid" placeholder="Malic Acid" required>
        <input type="number" step="any" name="total_phenols" placeholder="Total Phenols" required>
        <input type="number" step="any" name="flavanoids" placeholder="Flavanoids" required>
        <input type="number" step="any" name="color_intensity" placeholder="Color Intensity" required>
        <input type="number" step="any" name="proline" placeholder="Proline" required>

        <button type="submit">Predict Cultivar</button>
    </form>

    {% if prediction %}
        <h3>Prediction: {{ prediction }}</h3>
    {% endif %}
</div>
</body>
</html>
